[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-gate"
version = "0.1.0"
description = "Deterministic coordination gate for multi-agent fleets: an exit-code contract over a shared trace store."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "blushine" },
]
keywords = ["agent", "coordination", "deterministic", "mcp"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
engram-gate = "engram_gate.cli:entry"
engram-gate-mcp = "engram_gate.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
